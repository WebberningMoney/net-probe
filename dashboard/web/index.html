<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>net-probe 儀表板（Phase 2 簡易版）</title>
<style>
  body{font-family:-apple-system,"PingFang TC",sans-serif;margin:2rem;color:#222}
  table{border-collapse:collapse} th,td{padding:.4rem .9rem;border-bottom:1px solid #ddd;text-align:right}
  th:first-child,td:first-child{text-align:left} .bad{color:#c00} small{color:#777}
</style>
</head>
<body>
<h1>net-probe 儀表板 <small>簡易版（完整介面在 Phase 4）</small></h1>
<p>最新一秒：<span id="ts">—</span></p>
<p id="diag" style="padding:.6rem .9rem;background:#f3f6fa;border-radius:6px"></p>
<table><thead><tr><th>目標</th><th title="最近一秒的延遲（毫秒）；逾時代表沒收到回應" style="cursor:help">目前(ms)</th><th title="過去 5 分鐘的平均延遲（毫秒）" style="cursor:help">平均</th><th title="中位數：一半的樣本比它快，不受偶爾尖峰影響" style="cursor:help">p50</th><th title="95% 的樣本都比它快；愈大代表偶爾的尖峰愈明顯" style="cursor:help">p95</th><th title="連續兩次延遲的平均差距；愈大代表愈不穩定" style="cursor:help">抖動</th><th title="沒收到回應的比例" style="cursor:help">丟包%</th><th title="與 Bash 版相同的 Ping 分數（100 − 丟包×2 − 平均÷2 − 抖動×1.5）" style="cursor:help">分數</th><th title="通話品質分（1–4.5）：4.3+極佳、4.0+良好、3.6+尚可、3.1以下很差。看延遲、抖動、丟包，對偶爾的尖峰較寬容" style="cursor:help">MOS</th></tr></thead>
<tbody id="rows"></tbody></table>
<p><small>💡 MOS＝通話品質分（滿分約 4.4）：4.3 以上極佳｜4.0–4.3 良好｜3.6–4.0 尚可｜3.1 以下很差。滑鼠移到表頭可看各欄位說明。</small></p>
<h3>最近警示</h3><ul id="alerts"><li><small>尚無</small></li></ul>
<script>
let latest = {};
const f = v => v === null || v === undefined ? "—" : v;
async function refresh(){
  const r = await (await fetch("/api/summary?range=5m")).json();
  const body = document.getElementById("rows"); body.innerHTML = "";
  for (const [name, s] of Object.entries(r.targets)){
    const cur = latest[name];
    body.insertAdjacentHTML("beforeend",
      `<tr><td>${name}</td><td class="${cur==null?'bad':''}">${cur==null?'逾時':cur}</td>` +
      `<td>${f(s.avg)}</td><td>${f(s.p50)}</td><td>${f(s.p95)}</td><td>${f(s.jitter)}</td>` +
      `<td>${s.loss_pct}</td><td>${f(s.score)} ${s.grade}</td><td>${f(s.mos)}</td></tr>`);
  }
}
const es = new EventSource("/api/stream");
es.onmessage = e => { const d = JSON.parse(e.data); latest = d.results;
  document.getElementById("ts").textContent = new Date(d.ts*1000).toLocaleTimeString(); };
async function side(){
  const d = await (await fetch("/api/diagnosis")).json();
  document.getElementById("diag").innerHTML = `<b>判讀：${d.title}</b><br><small>${d.detail}` +
    (d.gateway_ip ? `（路由器 ${d.gateway_ip}）` : "") + `</small>`;
  const a = await (await fetch("/api/alerts")).json();
  document.getElementById("alerts").innerHTML = a.length ?
    a.slice(0,10).map(x => `<li>${new Date(x.ts*1000).toLocaleTimeString()} ${x.message}</li>`).join("") :
    "<li><small>尚無</small></li>";
}
refresh(); side(); setInterval(refresh, 5000); setInterval(side, 5000);
</script>
</body>
</html>
